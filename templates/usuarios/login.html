<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="body-login">
    <form class="form-login" method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="img-login">
            <img src="{% static 'img/SAMIBB.png' %}" alt="logo">
        </div>
        <div class="inputs-login">
            <div class="input">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite o usuário" required>
            </div>
            <div class="input">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite a senha" required>
            </div>
            <div class="input">
                <label for="cargo">Cargo</label>
                <select id="cargo" required>
                    <option value="lider">Líder</option>
                    <option value="pastor">Pastor</option>
                    <option value="pastor-presidente">Pastor presidente</option>
                    <option value="admin">Admnistrador</option>
                </select>
            </div>
            <div class="submit">
                 <input type="submit" id="submit" value="Entrar" >
            </div>
        </div>
    </form>
    <div class="page-final">
        
    </div>
</body>
</html>
